<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Pasrur Skill Worker</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <header class="standard-header">
        <h1>Connect with Us</h1>
        <p>We're here to assist you with Pasrur's most reliable service network</p>
    </header>

    <div style="padding: 6rem 5%; display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; max-width: 1400px; margin: 0 auto;">
        <div class="animate-up">
            <h2>Reach Our Support</h2>
            <p style="color: var(--text-muted); margin: 1.5rem 0 3rem;">Have a question? Our team is available 24/7.</p>
            <div style="margin-bottom: 2rem;"><h4 style="color: var(--primary)">Headquarters</h4><p>Main Bazaar, Pasrur, Punjab</p></div>
            <div style="margin-bottom: 2rem;"><h4 style="color: var(--primary)">Direct Helpline</h4><p>+92 300 1234567</p></div>
            <div><h4 style="color: var(--primary)">Email Support</h4><p>support@pasrurskill.pk</p></div>
        </div>
        <div class="animate-up">
            <div style="background: white; padding: 4rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border-top: 5px solid var(--primary);">
                <form id="contact-form">
                    <div class="form-group"><label>Your Name</label><input type="text" placeholder="John Doe" required></div>
                    <div class="form-group"><label>Email Address</label><input type="email" placeholder="john@example.pk" required></div>
                    <div class="form-group"><label>Message</label><textarea rows="5" placeholder="How can we help?" required></textarea></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1.2rem;">Deliver Message</button>
                </form>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="../js/store.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
